# Checks ECCC every 15 minutes for new model runs and publishes derived
# windgram profiles to data/. A no-new-run check costs one capabilities
# request per model and exits; commits happen only when a run advances, so
# repository history stays one commit per model run.
name: Build windgrams

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # The NOAA builders pull GRIB records by byte range — a fresh HRRR run is
    # ~1.3 GB and GFS ~2 GB — and REPS downloads ~1.5 GB of all-members wind
    # files, so the ceiling covers a check that lands every model's new run
    # at once.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Build HRDPS 2.5 km (the baseline; failure fails the job)
        run: uv run --no-dev python -m windgrams.build
      - name: Build HRDPS 1 km (experimental feed; failure must not block 2.5 km)
        run: uv run --no-dev python -m windgrams.build_1km || echo "::warning::1 km build failed"
      - name: Build RDPS 10 km (failure must not block the 2.5 km baseline)
        run: uv run --no-dev python -m windgrams.build_rdps || echo "::warning::RDPS build failed"
      - name: Build GDPS 15 km (failure must not block the 2.5 km baseline)
        run: uv run --no-dev python -m windgrams.build_gdps || echo "::warning::GDPS build failed"
      - name: Build HRRR 3 km (NOAA; failure must not block the 2.5 km baseline)
        run: uv run --no-dev python -m windgrams.build_hrrr || echo "::warning::HRRR build failed"
      - name: Build GFS 25 km (NOAA; failure must not block the 2.5 km baseline)
        run: uv run --no-dev python -m windgrams.build_gfs || echo "::warning::GFS build failed"
      - name: Build REPS 10 km ensemble (failure must not block the 2.5 km baseline)
        run: uv run --no-dev python -m windgrams.build_reps || echo "::warning::REPS build failed"
      - name: Commit new runs
        run: |
          git add data/
          if git diff --cached --quiet; then
            echo "No new run."
            exit 0
          fi
          message=""
          for manifest in data/hrdps-2p5km/manifest.json data/hrdps-1km-west/manifest.json data/rdps-10km/manifest.json data/gdps-15km/manifest.json data/hrrr-conus/manifest.json data/gfs-global/manifest.json data/reps-10km/manifest.json; do
            if git diff --cached --name-only | grep -qx "$manifest"; then
              part=$(python3 -c "import json; m=json.load(open('$manifest')); print(f\"{m['model']} run {m['referenceTime']}\")")
              message="${message:+$message; }$part"
            fi
          done
          git config user.name "windgrams-bot"
          git config user.email "actions@github.com"
          git commit -m "${message:-Data update}"
          # A code push can land while a build runs; data commits rebase over
          # it cleanly, so retry instead of stranding the run on the runner.
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          git push
  test:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv run pytest
